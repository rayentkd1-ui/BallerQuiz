let me = {name:'', gems:20, score:0, daily:''}, user = null, tab = 'home', timer = null;

async function boot(){
  if(sb){
    const {data} = await sb.auth.getSession(); user = data.session && data.session.user;
    if(user) await loadProfile(); await loadContent();
  } else { const s = store.get(); if(s) me = s; }
  render(); bell();
}
async function loadProfile(){
  const {data,error} = await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  PERR = error ? error.message : (data ? '' : 'لا يوجد ملف لاعب لهذا الحساب');
  if(data) me = {name:data.username, gems:data.gems, score:data.score, daily:data.last_daily||'', admin:data.is_admin, banned:data.banned, avatar:data.avatar||L('av'), banner:data.banner||L('bn'), theme:data.theme||'def', title:data.title||'', streak:data.streak||0};
  if(user){ const ot=await sb.from('owned_themes').select('theme').eq('user_id',user.id); OWNT=['def',...((ot.data)||[]).map(r=>r.theme)]; }
}
async function award(points, gems){
  me.score += points; me.gems += gems;
  if(sb && user){ const {error} = await sb.rpc('award',{p:points,g:gems}); if(error) toast('تعذّر الحفظ'); }
  else store.set();
  hud();
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

/* ===== خمّن اللاعب ===== */
let G = {};
function startGuess(){ G = {order:shuffle(PLAYERS.map((_,i)=>i)), n:0, shown:1, done:false, round:0, got:0, streak:0}; tab='guess'; render(); }
function vGuess(){
  const p = PLAYERS[G.order[G.n]];
  const pts = (6-G.shown)*10;
  const clues = p.c.map((c,i)=> i<G.shown ? `<div class="clue">${esc(c)}</div>` : `<div class="clue lock">تلميح مقفل</div>`).join('');
  $('#app').innerHTML = `
  <div class="top"><h2>من هو اللاعب؟</h2><span class="pts">${G.streak?'<span class="streak">🔥'+G.streak+'</span> ':''}${G.done?'':pts+' نقطة'}</span></div>
  ${clues}
  ${G.done ? `<div class="panel"><h3>${esc(p.a[0])}</h3><p class="muted">${G.msg||''}</p></div><div class="row"><button class="btn" onclick="nextGuess()">اللاعب التالي</button>${G.won?'<button class="btn ghost" onclick="shareRes()">مشاركة 📤</button>':''}</div>` : `
  <div class="panel" id="box"><input id="ans" placeholder="اكتب اسم اللاعب" autocomplete="off" onkeydown="if(event.key==='Enter')checkGuess()">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="checkGuess()">خمّن</button>
  <button class="btn ghost" onclick="moreClue()" ${G.shown>=5?'disabled':''}>تلميح إضافي</button></div></div>
  <button class="btn ghost" style="width:100%" onclick="giveUp()">استسلم</button>`}`;
}
function checkGuess(){
  const v = norm($('#ans').value); if(!v) return;
  const p = PLAYERS[G.order[G.n]];
  if(p.a.some(a=>norm(a)===v)){
    G.streak++; const pts=(6-G.shown)*10+Math.min(G.streak-1,5)*5; award(pts, G.shown<=2?2:1); G.done=true; G.won=true; G.msg=`إجابة صحيحة! +${pts} نقطة`+(G.streak>1?` (سلسلة ${G.streak} 🔥)`:''); vGuess();
  } else { const b=$('#box'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); $('#ans').select(); toast('ليس هو، جرّب مرة أخرى'); }
}
function moreClue(){ if(G.shown<5){G.shown++; vGuess();} }
function giveUp(){ G.streak=0; G.won=false; G.done=true; G.msg='لا بأس، الجولة القادمة أفضل'; G.shown=5; vGuess(); }
function nextGuess(){ G.n=(G.n+1)%PLAYERS.length; G.shown=1; G.done=false; vGuess(); window.scrollTo(0,0); }

let Q = {};
function startQuiz(){ Q={list:shuffle(QUIZ).slice(0,15).map(q=>({q:q[0],a:q[1],o:shuffle([q[1],...q[2]])})), i:0, ok:0, sok:0, chk:-1, locked:false}; tab='quiz'; render(); }
const STG=[['الملعب',15],['الدوري',12],['النهائي',9]];
function vQuiz(){
  const n=Q.list.length, b=Q.i>0&&Q.i%5===0&&Q.chk!==Q.i, pass=Q.sok>=3;
  if(Q.i>=n||(b&&!pass)){
    const fin=Q.i>=n&&pass, g=fin?(Q.ok>=13?8:Q.ok>=9?5:3):1;
    if(!Q.paid){ Q.paid=1; award(0,g); }
    $('#app').innerHTML=`<div class="hero" style="text-align:center"><h1>${fin?'أنهيت كل المراحل 🏆':'انتهت اللعبة'}</h1><p>${Q.ok} صحيحة من ${Q.i} — ${Q.ok*10} نقطة و${g} جواهر.</p>${fin?'':'<p class="muted">تحتاج 3 إجابات صحيحة من 5 لتعبر المرحلة.</p>'}</div><div class="row"><button class="btn" onclick="startQuiz()">العب مجدداً</button><button class="btn ghost" onclick="go('top')">المتصدرون</button></div>`; return;
  }
  if(b){ const s=Q.i/5; $('#app').innerHTML=`<div class="hero" style="text-align:center"><h1>أنهيت المرحلة ${s} ✅</h1><p>${Q.sok} من 5 — المرحلة التالية أصعب وأسرع.</p></div><button class="btn" style="width:100%" onclick="Q.chk=Q.i;Q.sok=0;vQuiz()">المرحلة ${s+1}: ${STG[Math.min(s,2)][0]}</button>`; return; }
  const q=Q.list[Q.i], st=Math.min(Math.floor(Q.i/5),2), T=STG[st][1]; Q.locked=false;
  $('#app').innerHTML=`<div class="top"><h2>مرحلة ${st+1}: ${STG[st][0]}</h2><span class="pts">${Q.ok*10} نقطة</span></div><p class="muted" style="margin-bottom:8px">سؤال ${Q.i%5+1} / 5 — ${T} ثانية</p>
  <div class="bar"><i id="bar"></i></div><div class="panel secret"><h3 style="font-size:24px">${esc(q.q)}</h3></div>
  ${q.o.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pick(${k})">${esc(o)}</button>`).join('')}`;
  let t=T; const bar=$('#bar');
  timer=setInterval(()=>{ t-=0.1; bar.style.width=(t/T*100)+'%'; if(t<=5&&Math.abs(t-Math.round(t))<.05&&t>.5) beep(740); if(t<=0){clearInterval(timer);pick(-1);} },100);
}
function pick(k){
  if(Q.locked) return; Q.locked=true; clearInterval(timer);
  const q=Q.list[Q.i], right=q.o.indexOf(q.a);
  document.querySelectorAll('.opt').forEach((b,i)=>{ if(i===right)b.classList.add('ok'); else if(i===k)b.classList.add('bad'); });
  if(k===right){ Q.ok++; Q.sok++; award(10,0); }
  setTimeout(()=>{Q.i++; vQuiz();},1100);
}

function guest(){ const n=$('#un').value.trim(); if(!n) return; me.name=n.slice(0,20); store.set(); render(); }
async function auth(mode){
  const email=$('#em').value.trim(), password=$('#pw').value, un=$('#un').value.trim();
  const e=$('#er'); e.textContent='';
  if(mode==='up'){
    if(!un) return e.textContent='اكتب اسم اللاعب أولاً';
    const {error}=await sb.auth.signUp({email,password,options:{data:{username:un.slice(0,20)}}});
    if(error) return e.textContent=error.message;
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error) return e.textContent='تعذّر الدخول: تأكد من البريد وكلمة المرور (وفعّل بريدك إن لزم)';
  user=data.user; await loadProfile(); render();
}
async function oauth(p){ const {error}=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin}}); if(error) $('#er').textContent=error.message; }

let S = {}, ITEMS = [], OWN = [], B0 = null;
async function loadContent(){
  if(!sb) return;
  if(!B0) B0 = {p:PLAYERS, q:QUIZ};
  const [s,p,q,i] = await Promise.all([sb.from('settings').select('*'), sb.from('players').select('*').eq('active',true), sb.from('questions').select('*').eq('active',true), sb.from('store_items').select('*').eq('active',true).order('price')]);
  (s.data||[]).forEach(r=>S[r.key]=r.value);
  PLAYERS = (p.data&&p.data.length) ? p.data.map(r=>({a:r.answers,c:r.clues})) : B0.p;
  QUIZ = (q.data&&q.data.length) ? q.data.map(r=>[r.q,r.answer,r.wrong]) : B0.q;
  ITEMS = i.data||[];
  if(user){ const o = await sb.from('inventory').select('item_id').eq('user_id',user.id); OWN = (o.data||[]).map(r=>r.item_id); }
  if(S.site_name) document.querySelector('.logo').firstChild.nodeValue = S.site_name;
}

/* ===== أونلاين (قنوات Realtime بدون جداول) ===== */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sshuf=(arr,r)=>arr.map(x=>[r(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function vOnline(){
  if(O&&O.ch){ try{sb.removeChannel(O.ch)}catch(e){} } O=null;
  $('#app').innerHTML=`<div class="top"><h2>العب أونلاين ⚔️</h2></div><div class="panel"><button class="btn" style="width:100%" onclick="mkRoom()">إنشاء غرفة</button>
  <p class="muted" style="text-align:center;margin:12px 0">أو أدخل كود صديقك</p>
  <input id="rc" placeholder="كود الغرفة" maxlength="5" style="text-transform:uppercase;text-align:center;letter-spacing:6px"><button class="btn ghost" style="width:100%;margin-top:10px" onclick="joinRoom()">انضمام</button></div>`;
}
function mkRoom(){ openRoom(Math.random().toString(36).slice(2,7).toUpperCase(),true); }
function joinRoom(){ const c=$('#rc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length<4) return toast('اكتب الكود'); openRoom(c,false); }
function openRoom(code,host){
  if(!sb) return toast('يحتاج اتصالاً بالإنترنت');
  const id=Math.random().toString(36).slice(2);
  O={code,host,sc:0,opp:{name:'',sc:0,i:0},i:0,started:false,done:false};
  const ch=sb.channel('room-'+code,{config:{broadcast:{self:false},presence:{key:id}}}); O.ch=ch;
  ch.on('presence',{event:'sync'},()=>{ const np=Object.keys(ch.presenceState()).length; if(np>=2) O.seen2=true; if(O.seen2&&O.started&&!O.paid&&np<2&&!O.gone){ O.gone=true; toast('الخصم غادر المباراة'); if(O.done) return endOnline(); } if(O.host&&!O.started&&Object.keys(ch.presenceState()).length>=2){ O.started=true; const seed=Math.floor(Math.random()*1e9); ch.send({type:'broadcast',event:'start',payload:{seed}}); runOnline(seed); } })
    .on('broadcast',{event:'start'},({payload})=>{ if(!O.started){ O.started=true; runOnline(payload.seed); } })
    .on('broadcast',{event:'sc'},({payload})=>{ O.opp=payload; if(O.done) endOnline(); else upO(); })
    .subscribe(st=>{ if(st==='SUBSCRIBED') ch.track({name:tn()}); });
  $('#app').innerHTML=`<div class="panel" style="text-align:center"><h3>بانتظار صديقك…</h3><p class="muted">${host?'شارك هذا الكود معه':'جارٍ الاتصال بالغرفة'}</p><div style="font-size:44px;letter-spacing:8px;font-weight:700;color:var(--card);margin:14px 0">${code}</div>
  <div class="row"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${code}');toast('تم النسخ')">نسخ</button><button class="btn ghost" onclick="vOnline()">إلغاء</button></div></div>`;
}
function runOnline(seed){
  const r=rng(seed); O.list=sshuf(QUIZ,r).slice(0,15).map(q=>({q:q[0],a:q[1],o:sshuf([q[1],...q[2]],r)}));
  let c=3; const tick=()=>{ if(c===0) return qO(); $('#app').innerHTML=`<div class="hero" style="text-align:center"><h1 style="font-size:90px">${c}</h1><p>المباراة تبدأ بعد…</p></div>`; c--; setTimeout(tick,1000); }; tick();
}
function upO(){ const e=$('#so'); if(e) e.textContent=`أنت ${O.sc*10} · ${O.opp.name||'الخصم'} ${(O.opp.sc||0)*10}`; }

function botCh(){
  const pool=DP.filter(p=>p.lvl===myLv()), B=(pool.length?pool:DP)[Math.floor(Math.random()*(pool.length||DP.length))]; BOTPL=B; let cands=DP.slice(), used={}, h={}, n=0;
  const out=(ev,pl,ms)=>setTimeout(()=>{ if(DU&&!DU.over&&h[ev]) h[ev]({payload:pl}); },ms);
  const qs=()=>{ const q=['هل هو معتزل؟','هل هو مهاجم؟','هل هو لاعب وسط؟','هل هو مدافع؟','هل هو حارس مرمى؟','هل هو أوروبي؟','هل هو أفريقي؟','هل هو من أمريكا الجنوبية؟','هل فاز بكأس العالم؟','هل فاز بدوري أبطال أوروبا؟','هل فاز بالكرة الذهبية؟','هل لعب في الدوري الإنجليزي؟','هل لعب في الدوري الإسباني؟','هل لعب في الدوري الإيطالي؟','هل لعب في الدوري الألماني؟','هل لعب في الدوري الفرنسي؟','هل يلعب بالقدم اليسرى؟'];

    let best=null,bs=0; for(const q of qs()){ if(used[q]) continue; let y=0,no=0; for(const p of cands){ const v=nluAns(q,p); if(v===1)y++; else if(v===0)no++; } const sc=Math.min(y,no); if(sc>bs){ bs=sc; best=q; } }
